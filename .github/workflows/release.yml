# Release of an application that brings its own runtime (system.json hosting "own", principle 007; added by the
# demo-environment skill). After a green Build of the default branch, it turns that build into a release candidate:
#   - the package <slug>-<deployable>.<version>.zip in the Octopus built-in feed, with deploy.ps1 and verify.ps1 at
#     its root: the Build's artifact deploy-package when it kept one (the whole content of the package: for a
#     package that needs more than the folder as committed, a compiled tool for example), otherwise the content of
#     this repository's deploy/ folder. The Octopus project runs the two scripts in every environment; what they
#     deploy, and to what, is this application's own
#   - when the Build kept an image (artifact container-image): that image as <registry>/<slug>/<deployable>:<version>
#     in the system's registry (Azure OIDC, id-<slug>-acr-push), its tag write-locked; not a second build
#   - a release <version> of the Octopus project <slug>-<deployable>; its lifecycle deploys it to the first environment
# The version is the Build run's MAJOR.MINOR.run_number, read from build.yml.
# Credentials: GitHub OIDC only (environment "release"). Deployments, approvals and the GitOps pin are Octopus's.
name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master, main]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The Octopus actions (create-release) look the space up by name, not by ID.
  OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE_NAME }}

jobs:
  release:
    # A push to the default branch, or a Build of it started by hand: after a change to the Octopus deployment process
    # (which a release snapshots), `gh workflow run Build` makes a new release without a code change.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content -LiteralPath .github/workflows/build.yml -Raw
          $major = [regex]::Match($workflow, '(?m)^\s*MAJOR_VERSION:\s*(\d+)').Groups[1].Value
          $minor = [regex]::Match($workflow, '(?m)^\s*MINOR_VERSION:\s*(\d+)').Groups[1].Value
          if (-not $major -or -not $minor) { throw 'MAJOR_VERSION and MINOR_VERSION not found in build.yml' }
          "version=$major.$minor.${{ github.event.workflow_run.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Find the build's artifacts
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" --jq '[.artifacts[].name] | join(" ")')
          case " $names " in *" container-image "*) echo "found=true" >> "$GITHUB_OUTPUT";; *) echo "found=false" >> "$GITHUB_OUTPUT";; esac
          case " $names " in *" deploy-package "*) echo "package=true" >> "$GITHUB_OUTPUT";; *) echo "package=false" >> "$GITHUB_OUTPUT";; esac

      - name: Download the build's deploy package
        if: steps.image.outputs.package == 'true'
        uses: actions/download-artifact@v8
        with:
          name: deploy-package
          path: ./deploy-package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Package the application's deploy and verify code
        shell: pwsh
        env:
          PACKAGE_ID: ${{ vars.SYSTEM_SLUG }}-${{ vars.DEPLOYABLE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE: ${{ steps.image.outputs.package == 'true' && './deploy-package' || './deploy' }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($entry in 'deploy.ps1', 'verify.ps1') {
            if (-not (Test-Path -LiteralPath (Join-Path $env:SOURCE $entry))) { throw "$env:SOURCE/$entry is missing: the system runs it in every environment." }
          }
          New-Item -ItemType Directory -Path octopus-packages -Force | Out-Null
          # The folder's content at the root of the zip, so deploy.ps1 and verify.ps1 are at the package's root.
          Compress-Archive -Path (Get-ChildItem -LiteralPath $env:SOURCE -Force).FullName `
            -DestinationPath "./octopus-packages/$env:PACKAGE_ID.$env:VERSION.zip" -CompressionLevel Optimal

      - name: Download the build's image
        if: steps.image.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: container-image
          path: ./image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: azure/login@v3
        if: steps.image.outputs.found == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push the image
        if: steps.image.outputs.found == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.SYSTEM_SLUG }}/${{ vars.DEPLOYABLE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gunzip --stdout ./image/container-image.tar.gz | docker load
          docker image inspect "container-image:${VERSION}" --format 'Loaded {{.Id}}'
          docker tag "container-image:${VERSION}" "$IMAGE"
          az acr login --name "${{ vars.ACR_NAME }}"
          docker push "$IMAGE"
          # A released image never changes: lock its tag (role "ACR tag lock" of the seed).
          az acr repository update --name "${{ vars.ACR_NAME }}" --image "${{ vars.SYSTEM_SLUG }}/${{ vars.DEPLOYABLE_NAME }}:${VERSION}" \
            --write-enabled false --delete-enabled false --output none
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Octopus
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ vars.OCTOPUS_URL }}
          service_account_id: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}

      # A released package never changes either: the feed keeps the first upload of a version.
      - name: Push the package
        uses: OctopusDeploy/push-package-action@v4
        with:
          packages: octopus-packages/${{ vars.SYSTEM_SLUG }}-${{ vars.DEPLOYABLE_NAME }}.${{ steps.version.outputs.version }}.zip
          overwrite_mode: IgnoreIfExists

      - name: Create the release
        uses: OctopusDeploy/create-release-action@v4
        with:
          project: ${{ vars.SYSTEM_SLUG }}-${{ vars.DEPLOYABLE_NAME }}
          release_number: ${{ steps.version.outputs.version }}
          package_version: ${{ steps.version.outputs.version }}
          ignore_existing: true
          release_notes: "Build ${{ github.event.workflow_run.html_url }} of ${{ github.event.workflow_run.head_sha }}"
