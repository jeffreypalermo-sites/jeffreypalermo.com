# Build of jeffreypalermo.com (ADR-0006): the tests of every layer, and the container image, built once per commit and
# kept as the artifact container-image. After a green Build of master, the system's release.yml (added by the
# demo-environment-kit when it adopts this repository) pushes that same image to the system's registry and creates the
# Octopus release; nothing is built a second time.
#
# The image carries what the Build measured (build-facts.json, ADR-0012), so it is built after the tests: job image
# needs job test, reads its results and writes the facts before `docker build`. The site answers them at /_build.
#
# The kit keeps this file instead of its generic Build because the image needs the Git LFS files (the video under
# content/uploads). What release.yml and the kit rely on, pinned by BuildWorkflowContractTests:
#   - the name "Build";
#   - MAJOR_VERSION and MINOR_VERSION below: the version is MAJOR_VERSION.MINOR_VERSION.<run number>;
#   - the artifact container-image: container-image.tar.gz, a gzip of `docker save container-image:<version>`;
#   - the job "Build result", which needs every other job and is the one required check.
name: Build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  MAJOR_VERSION: 1
  MINOR_VERSION: 0

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # coverlet.collector, in the format that keeps every branch path, so the two runs can be taken together
      # (scripts/Write-BuildFacts.ps1). Generated code under obj/ is not the site's code.
      COVERAGE: XPlat Code Coverage;Format=opencover;ExcludeByFile=**/obj/**
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The compile is the static analysis: the .NET analyzers run in it and a warning is an error
      # (Directory.Build.props). Its log goes with the test results, and the facts count what it found (ADR-0012).
      - name: Compile
        run: dotnet build JeffreyPalermo.slnx --configuration Release "-flp:LogFile=TestResults/compile.msbuild.log;Verbosity=minimal;Summary"

      - name: Unit tests
        run: dotnet test tests/UnitTests --configuration Release --no-build --logger trx --results-directory TestResults --collect "${COVERAGE}"

      - name: Integration tests
        run: dotnet test tests/IntegrationTests --configuration Release --no-build --logger trx --results-directory TestResults --collect "${COVERAGE}"

      # The site's own infrastructure code (deploy/, ADR-0007) must compile without a diagnostic before it is released.
      - name: Compile the infrastructure code
        run: |
          set -euo pipefail
          # The site's template, with the module it deploys for host names, and the DNS zone's (ADR-0016).
          notices="$(az bicep build --file deploy/infra/main.bicep --stdout 2>&1 >/dev/null; az bicep build --file deploy/infra/dns-zone.bicep --stdout 2>&1 >/dev/null)"
          echo "$notices"
          # A diagnostic of the template fails the Build; the CLI's own notices (a newer Bicep exists) do not.
          if echo "$notices" | grep --quiet --extended-regexp ' : (Warning|Error) '; then exit 1; fi

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  image:
    name: Container image and full-system tests
    # After the tests, not beside them: the image carries what they measured (ADR-0012).
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.1

      # The image needs the Git LFS files: without them it would hold a pointer instead of the video, and the
      # Dockerfile refuses to build. They are cached by their object ids, so a run downloads only what is new and
      # the 76 MB video does not count against the LFS bandwidth allowance on every run.
      - name: List the Git LFS objects
        run: git lfs ls-files --long | cut --delimiter=' ' --fields=1 | sort > .lfs-objects

      - name: Restore the Git LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Check out the Git LFS files
        run: git lfs pull

      - name: Version
        run: echo "VERSION=${MAJOR_VERSION}.${MINOR_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # What this release was built from and what job test measured, written beside the Dockerfile, which copies it
      # into the image. The results stay outside the checkout: TestResults is for the full-system tests below.
      # A release without tests at three levels and an analysis is not built. The acceptance level is declared: the
      # URL contract, which the pipeline replays against the first environment after this Build.
      - name: Download the test results
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results

      - name: Write the build facts
        shell: pwsh
        run: ./scripts/Write-BuildFacts.ps1 -Version $env:VERSION -ResultsPath (Join-Path $env:RUNNER_TEMP test-results) -Require tests.unit, tests.integration, tests.acceptance, coverage, analysis -OutputPath build-facts.json

      - name: Build the image
        run: |
          set -euo pipefail
          docker build --file Dockerfile \
            --build-arg "VERSION=${VERSION}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "container-image:${VERSION}" .

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The full-system tests drive the container in Chromium (ADR-0009). Playwright's own script installs the
      # browser build its version expects, with the system libraries a runner may lack.
      - name: Install the browser for the full-system tests
        run: |
          set -euo pipefail
          dotnet build tests/AcceptanceTests --configuration Release
          pwsh tests/AcceptanceTests/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium

      # The published app as a process, and the image just built as a container: the URL contract over real HTTP
      # against both. JPCOM_IMAGE makes the container tests run this image, so what is tested is what is released.
      - name: Full-system tests
        env:
          JPCOM_IMAGE: container-image:${{ env.VERSION }}
        run: dotnet test tests/AcceptanceTests --configuration Release --logger trx --results-directory TestResults

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-full-system
          path: TestResults

      # What the system's pipeline runs in every environment (ADR-0007): the deploy/ folder with the contract verifier
      # and the URL contract of this commit beside it. Release pushes it as the package of the release.
      - name: Assemble the deploy package
        run: scripts/build-deploy-package.sh "$RUNNER_TEMP/deploy-package"

      - name: Upload the deploy package
        uses: actions/upload-artifact@v7
        with:
          name: deploy-package
          path: ${{ runner.temp }}/deploy-package
          if-no-files-found: error
          retention-days: 7

      - name: Save the image
        run: |
          set -euo pipefail
          docker save "container-image:${VERSION}" | gzip > container-image.tar.gz
          echo "Image ${VERSION}: $(du -h container-image.tar.gz | cut -f1) compressed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: container-image
          path: container-image.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The one check the master ruleset requires: it reports the outcome of every other job under a fixed name.
  result:
    name: Build result
    needs: [test, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          echo "test: ${TEST_RESULT}"
          echo "image: ${IMAGE_RESULT}"
          test "${TEST_RESULT}" = "success"
          test "${IMAGE_RESULT}" = "success"
